services:
  web:
    build:
      context: .
      target: web
    image: meet-in-the-middle-web
    container_name: meet-web
    restart: unless-stopped
    depends_on:
      - sync
    # Loopback by default, so the port is not exposed on any network interface
    # and the Cloudflare tunnel is the only way in.
    #
    # That only works when cloudflared runs on the host. If it runs as a
    # container it cannot reach the host's loopback, and it needs either
    # MEET_BIND=0.0.0.0 (reachable at the host's LAN address) or — better —
    # the shared-network setup described in the README, which needs no
    # published port at all.
    ports:
      - '${MEET_BIND:-127.0.0.1}:${MEET_PORT:-8090}:80'

  sync:
    build:
      context: .
      target: sync
    image: meet-in-the-middle-sync
    container_name: meet-sync
    restart: unless-stopped
    # No published port. Only nginx talks to it, over the compose network.
    expose:
      - '8081'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
